[package]
name = "wtimer"
version = "0.1.0"
edition = "2024"

[lib]
name = "wtimer_lib"
path = "src/lib.rs"

[[bin]]
name = "wtimer"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["cargo", "derive"] }
mime_guess = "2.0.5"
postcard = { version = "1.1.3", features = ["use-std"] }
redb = "4.1.0"
rust-embed = { version = "8.11.0", features = ["axum"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.3", features = ["v7", "fast-rng", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
axum-test = "21.0.0"
serde_json = "1.0.150"

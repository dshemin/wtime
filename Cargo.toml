[package]
name = "wtimer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9" }
mime_guess = "2.0.5"
rust-embed = { version = "8.11.0", features = ["axum"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }
